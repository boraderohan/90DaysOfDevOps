services:
  web:
    build: ./app
    ports:
      - "5000"
    depends_on:
      - db
      - redis
    environment:
      FLASK_ENV: development
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: appdb
      REDIS_HOST: redis
    networks:
      - app_network
    labels:
      project: docker-learning
      service: web-app

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mysql_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network
    labels:
      project: docker-learning
      service: database

  redis:
    image: redis:7
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app_network
    labels:
      project: docker-learning
      service: cache

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
